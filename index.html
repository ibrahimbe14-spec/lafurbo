<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAFURBO — Juego de fútbol 3D gratis</title>
<meta name="description" content="Juega gratis a LAFURBO, un divertido juego de fútbol 3D en tu navegador. ¡Marca goles y supera tu récord!">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://TU-DOMINIO.com/">
<style>
*{box-sizing:border-box}body{margin:0;background:#08131b;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 12px 8px}h1{margin:0;color:#7cff7c;font-size:clamp(34px,6vw,58px);letter-spacing:4px}
header p{margin:6px 0 12px;color:#d8e6ec}
#wrap{width:min(1000px,96vw);margin:auto;position:relative}
canvas{width:100%;height:auto;display:block;border:3px solid #b9e7bd;border-radius:14px;background:#198b43;touch-action:none}
.hud{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-weight:bold;margin:10px}
.hud span{background:#142b36;padding:8px 14px;border-radius:9px}
button{border:0;border-radius:10px;background:#7cff7c;color:#06200d;font-size:16px;font-weight:bold;padding:12px 20px;cursor:pointer;margin:5px}
button:hover{filter:brightness(1.08)}.help{max-width:850px;margin:14px auto 28px;padding:0 14px;color:#d8e6ec;line-height:1.55}
kbd{background:#203c49;border:1px solid #63808b;border-radius:5px;padding:2px 6px;color:#fff}
</style>
</head>
<body>
<header><h1>LAFURBO</h1><p>Fútbol 3D en tu navegador · ¡Juega gratis!</p></header>
<div id="wrap">
  <div class="hud"><span>⚽ Goles: <b id="score">0</b></span><span>⏱ Tiempo: <b id="time">60</b>s</span><span>🏆 Récord: <b id="best">0</b></span></div>
  <canvas id="game" width="960" height="600" aria-label="Campo de fútbol de LAFURBO"></canvas>
  <div><button id="start">Empezar partida</button><button id="reset">Reiniciar</button></div>
</div>
<div class="help">
  <b>Cómo jugar:</b> muévete con <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o las flechas.
  Pulsa <kbd>ESPACIO</kbd> para chutar cuando estés cerca del balón. En móvil, arrastra el dedo para moverte y toca <b>CHUTAR</b>.
  Tienes 60 segundos para marcar tantos goles como puedas.
  <div style="margin-top:10px"><button id="kick">CHUTAR ⚽</button></div>
</div>
<script>
(() => {
const c=document.getElementById('game'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');
let player={x:480,y:455,r:19,vx:0,vy:0}, ball={x:480,y:300,vx:0,vy:0,r:11};
let score=0,time=60,playing=false,last=0,keys={},pointer=null,goalFlash=0;
let best=Number(localStorage.getItem('lafurboBest')||0);bestEl.textContent=best;
const goal={x:365,y:48,w:230,h:24};
function reset(){player={x:480,y:455,r:19,vx:0,vy:0};ball={x:480,y:300,vx:0,vy:0,r:11};score=0;time=60;scoreEl.textContent=0;timeEl.textContent=60;playing=false;draw(); }
function start(){if(time<=0)reset();playing=true;last=performance.now();requestAnimationFrame(loop)}
function shoot(){if(!playing)return;let dx=ball.x-player.x,dy=ball.y-player.y,d=Math.hypot(dx,dy);if(d<65){let len=Math.max(1,d);ball.vx=dx/len*10;ball.vy=dy/len*10-3;}}
document.getElementById('start').onclick=start;document.getElementById('reset').onclick=reset;document.getElementById('kick').onclick=shoot;
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();pointer={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(pointer){const r=c.getBoundingClientRect();pointer={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}});
c.addEventListener('pointerup',()=>pointer=null);
function field(){
 ctx.fillStyle='#168442';ctx.fillRect(0,0,960,600);
 for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.035)';ctx.fillRect(i*120,0,120,600)}
 ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=4;ctx.strokeRect(35,25,890,550);
 ctx.beginPath();ctx.moveTo(35,300);ctx.lineTo(925,300);ctx.stroke();
 ctx.beginPath();ctx.arc(480,300,78,0,Math.PI*2);ctx.stroke();
 ctx.strokeRect(300,25,360,125);ctx.strokeRect(365,25,230,55);
 // Goal net and posts
 ctx.fillStyle='#e8f5e9';ctx.fillRect(goal.x,goal.y,goal.w,goal.h);
 ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.strokeRect(goal.x,goal.y-5,goal.w,goal.h+8);
 ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=1;
 for(let x=goal.x+10;x<goal.x+goal.w;x+=18){ctx.beginPath();ctx.moveTo(x,goal.y);ctx.lineTo(x,goal.y+goal.h);ctx.stroke()}
 for(let y=goal.y+6;y<goal.y+goal.h;y+=7){ctx.beginPath();ctx.moveTo(goal.x,y);ctx.lineTo(goal.x+goal.w,y);ctx.stroke()}
}
function draw(){
 field();
 // shadows
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(player.x,player.y+16,22,8,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(ball.x,ball.y+9,12,5,0,0,Math.PI*2);ctx.fill();
 // player
 let grad=ctx.createRadialGradient(player.x-7,player.y-8,3,player.x,player.y,22);grad.addColorStop(0,'#8de7ff');grad.addColorStop(1,'#0755b8');
 ctx.fillStyle=grad;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x+6,player.y-4,3,0,Math.PI*2);ctx.fill();
 // ball
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle='#20252a';ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,Math.PI*2);ctx.fill();
 if(goalFlash>0){ctx.fillStyle=`rgba(255,255,255,${goalFlash/24})`;ctx.fillRect(0,0,960,600)}
 if(!playing){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,960,600);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px Arial';ctx.fillText(time===0?'¡PARTIDA TERMINADA!':'LAFURBO',480,270);ctx.font='22px Arial';ctx.fillText(time===0?`Has marcado ${score} goles`:'Pulsa “Empezar partida” para jugar',480,312)}
}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/16.67,2);last=now;
 let ax=0,ay=0;
 if(keys['arrowleft']||keys['a'])ax--;if(keys['arrowright']||keys['d'])ax++;
 if(keys['arrowup']||keys['w'])ay--;if(keys['arrowdown']||keys['s'])ay++;
 if(pointer){let dx=pointer.x-player.x,dy=pointer.y-player.y;if(Math.hypot(dx,dy)>12){ax=dx/Math.hypot(dx,dy);ay=dy/Math.hypot(dx,dy)}}
 let l=Math.hypot(ax,ay)||1;player.x+=ax/l*4.2*dt;player.y+=ay/l*4.2*dt;
 player.x=Math.max(55,Math.min(905,player.x));player.y=Math.max(85,Math.min(550,player.y));
 let dx=ball.x-player.x,dy=ball.y-player.y,d=Math.hypot(dx,dy);
 if(d<player.r+ball.r+3){let nx=dx/(d||1),ny=dy/(d||1);ball.x=player.x+nx*(player.r+ball.r+3);ball.y=player.y+ny*(player.r+ball.r+3);ball.vx+=nx*1.0;ball.vy+=ny*1.0}
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.985,dt);ball.vy*=Math.pow(.985,dt);
 if(ball.x<48||ball.x>912)ball.vx*=-.72;ball.x=Math.max(48,Math.min(912,ball.x));
 if(ball.y>560){ball.y=560;ball.vy*=-.65}
 if(ball.y<goal.y+goal.h && ball.x>goal.x+8 && ball.x<goal.x+goal.w-8 && ball.y>goal.y-5){score++;scoreEl.textContent=score;goalFlash=24;ball={x:480,y:300,vx:0,vy:0,r:11};player.x=480;player.y=455}
 else if(ball.y<30){ball.y=30;ball.vy=Math.abs(ball.vy)*.7}
 if(goalFlash>0)goalFlash--;
 time-=dt/60;if(time<=0){time=0;playing=false;if(score>best){best=score;localStorage.setItem('lafurboBest',best);bestEl.textContent=best}}
 timeEl.textContent=Math.ceil(time);draw();if(playing)requestAnimationFrame(loop);
}
draw();
})();
</script>
</body></html>
